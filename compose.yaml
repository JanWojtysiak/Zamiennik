services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:18421:3000"
    environment:
      DATABASE_URL: postgresql://zamiennik:zamiennik@postgres:5432/zamiennik
      FRONTEND_URL: http://localhost:18473
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx watch src/app.ts"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:18473:5173"
    environment:
      API_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zamiennik
      POSTGRES_PASSWORD: zamiennik
      POSTGRES_DB: zamiennik
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamiennik -d zamiennik"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
